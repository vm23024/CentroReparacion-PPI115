<body>
  <div class="net-background"></div>

  <div class="container py-4">
    <!-- Tarjeta Principal del Sistema -->
    <div class="card shadow-lg mx-auto" style="max-width: 1050px;">
      
      <!-- Encabezado Estilizado Verde Oscuro Corporativo con Logo -->
      <div class="card-header text-white d-flex justify-content-between align-items-center py-3" style="background-color: #2d5a27; border-top-left-radius: 12px; border-top-right-radius: 12px;">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-success d-flex align-items-center justify-content-center rounded-2 shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-cpu-fill fs-4"></i>
          </div>
          <div>
            <h2 class="h6 m-0 fw-bold text-white">SYS-REPAIR</h2>
            <small class="text-light" style="font-size: 0.75rem; opacity: 0.85;">Centro de Reparación de Dispositivos Móviles</small>
          </div>
        </div>
        <span class="fs-4 text-light"><i class="bi bi-tools"></i></span>
      </div>

      <!-- Contenido Principal con Tarjeta Centrada -->
      <div class="card-body p-4 d-flex justify-content-center align-items-center" style="min-height: 480px; background-color: rgba(234, 242, 234, 0.6); border-radius: 0 0 12px 12px;">
        
        <!-- Tarjeta Flotante del Login -->
        <div class="card shadow-lg border-0 rounded-4 p-4 text-center w-100" style="max-width: 400px; background-color: #ffffff;">
          
          <!-- Imagen de Usuario -->
          <div class="mx-auto mb-3 rounded-circle overflow-hidden shadow-sm border border-2 border-success d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
            <img src="img/icons8-user-avatar-50.png" alt="Foto de Usuario" class="w-100 h-100 object-fit-cover">
          </div>

          <h3 class="h4 fw-bold text-dark mb-4">Iniciar Sesión</h3>

          <form id="formLogin">
            
            <!-- Campo: Correo Electrónico -->
            <div class="text-start mb-3">
              <label class="form-label small fw-semibold text-muted mb-1">Usuario:</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="text" id="txtUsuario" class="form-control bg-light border-start-0 rounded-end-pill py-2 small" placeholder="nombreUsuario" required>
              </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="text-start mb-3">
              <label class="form-label small fw-semibold text-muted mb-1">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="txtPassword" class="form-control bg-light border-start-0 border-end-0 py-2 small" placeholder="••••••••••••" required>
                <span class="input-group-text bg-light border-start-0 rounded-end-pill pe-3 text-muted" style="cursor: pointer;">
                  <i class="bi bi-eye-slash"></i>
                </span>
              </div>
            </div>

            <!-- Opciones Adicionales -->
            <div class="d-flex justify-content-between align-items-center mb-4 small">
              <div class="form-check m-0 d-flex align-items-center gap-1">
                <input class="form-check-input mt-0" type="checkbox" id="recordarme" checked>
                <label class="form-check-label text-muted" for="recordarme">Recordarme</label>
              </div>
              <a href="#" class="text-decoration-none fw-semibold text-success">¿Olvidó la contraseña?</a>
            </div>
            <p class="register">¿No tienes cuenta? <a href="registro.html" id="register-link">Regístrate</a></p>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
              Iniciar sesión
            </button>
          </form>
          <div id="mensajeError" style="color: red; display: none;"></div>
        </div>
      </div>
      <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar que la página se recargue

            // 1. Recolectar los datos ingresados por el usuario
            $usuario = document.getElementById('txtUsuario').value;
            $password = document.getElementById('txtPassword').value;
            $errorDiv = document.getElementById('mensajeError');

            $errorDiv.style.display = 'none';

            try {
                // 2. Realizar la petición POST en formato JSON a tu endpoint PHP
                // Se utiliza ruta relativa ya que el HTML está en el mismo servidor
                $response = await fetch('../index.php/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: $usuario,
                        password: $password
                    })
                });

                $result = await $response.json();

                if ($response.ok && $result.status === 'success') {
                    // 3. ¡Login Exitoso! Guardamos el Token JWT en el navegador
                    localStorage.setItem('jwt_token', $result.token);

                    // Redirigir al usuario al panel principal o dashboard de la app
                    alert('¡Bienvenido al sistema!');
                    window.location.href = 'perfilUsuario.html';
                } else {
                    // 4. Mostrar error si las credenciales son incorrectas
                    $errorDiv.textContent = $result.message || 'Credenciales incorrectas';
                    $errorDiv.style.display = 'block';
                }
            } catch ($error) {
                $errorDiv.textContent = 'Error de conexión con el servidor.';
                $errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
