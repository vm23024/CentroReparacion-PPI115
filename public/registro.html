<body>
  <div class="net-background"></div>

  <div class="container py-4">
    <!-- Tarjeta Principal del Sistema -->
    <div class="card shadow-lg mx-auto" style="max-width: 1050px;">
      
      <!-- Encabezado Estilizado Verde Oscuro Corporativo con Logo -->
      <div class="card-header text-white d-flex justify-content-between align-items-center py-3" style="background-color: #2d5a27; border-top-left-radius: 12px; border-top-right-radius: 12px;">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-success d-flex align-items-center justify-content-center rounded-2 shadow-sm" style="width: 40px; height: 40px;">
            <i class="bi bi-cpu-fill fs-4"></i>
          </div>
          <div>
            <h2 class="h6 m-0 fw-bold text-white">SYS-REPAIR</h2>
            <small class="text-light" style="font-size: 0.75rem; opacity: 0.85;">Centro de Reparación de Dispositivos Móviles</small>
          </div>
        </div>
        <span class="fs-4 text-light"><i class="bi bi-tools"></i></span>
      </div>

      <!-- Contenido Principal con Tarjeta Centrada -->
      <div class="card-body p-4 d-flex justify-content-center align-items-center" style="min-height: 480px; background-color: rgba(234, 242, 234, 0.6); border-radius: 0 0 12px 12px;">
        
        <!-- Tarjeta Flotante del Login -->
        <div class="card shadow-lg border-0 rounded-4 p-4 text-center w-100" style="max-width: 400px; background-color: #ffffff;">
          
          <!-- Imagen de Usuario -->
          <div class="mx-auto mb-3 rounded-circle overflow-hidden shadow-sm border border-2 border-success d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
            <img src="IMG/icons8-user-avatar-50.png" alt="Foto de Usuario" class="w-100 h-100 object-fit-cover">
          </div>

          <h3 class="h4 fw-bold text-dark mb-4">Registrarse</h3>

          <form action="index12.html" method="GET">
            
            <!-- Campo: Nombre usuario -->
            <div class="text-start mb-3">
              <label class="form-label small fw-bold text-secondary">Nombre</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-person-badge text-muted"></i>
                </span>
                <input type="input-group" class="form-control bg-light border-start-0 rounded-end-pill py-2 small" placeholder="" required>
              </div>
            </div>

            <!-- Campo: Apellido usuario -->
            <div class="text-start mb-3">
              <label class="form-label small fw-bold text-secondary">Apellido</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-person-badge text-muted"></i>
                </span>
                <input type="input-group" class="form-control bg-light border-start-0 rounded-end-pill py-2 small" placeholder="" required>
              </div>
            </div>

            <!-- Campo: Telefono usuario -->
            <div class="text-start mb-3">
              <label class="form-label small fw-bold text-secondary">Telefono</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-phone text-muted"></i>
                </span>
                <input type="input-group" class="form-control bg-light border-start-0 rounded-end-pill py-2 small" placeholder="" required>
              </div>
            </div>

            <!-- Campo: Correo Electrónico -->
            <div class="text-start mb-3">
              <label class="form-label small fw-semibold text-muted mb-1">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" class="form-control bg-light border-start-0 rounded-end-pill py-2 small" placeholder="ejemplo@gmail.com" required>
              </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="text-start mb-3">
              <label class="form-label small fw-semibold text-muted mb-1">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control bg-light border-start-0 border-end-0 py-2 small" placeholder="••••••••••••" required>
                <span class="input-group-text bg-light border-start-0 rounded-end-pill pe-3 text-muted" style="cursor: pointer;">
                  <i class="bi bi-eye-slash"></i>
                </span>
              </div>
            </div>

            <!-- Campo: Repetir Contraseña -->
            <div class="text-start mb-3">
              <label class="form-label small fw-semibold text-muted mb-1">Repetir contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3 text-muted">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control bg-light border-start-0 border-end-0 py-2 small" placeholder="••••••••••••" required>
                <span class="input-group-text bg-light border-start-0 rounded-end-pill pe-3 text-muted" style="cursor: pointer;">
                  <i class="bi bi-eye-slash"></i>
                </span>
              </div>
            </div>

            <!-- Opciones Adicionales -->
            <p class="register">¿Ya tienes cuenta? <a href="index2.html" id="register-link">Iniciar sesión</a></p>

            <a href="index4.html" type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
              Registrarse
            </a>
          </form>
        </div>
      </div>
</body>
</html>
